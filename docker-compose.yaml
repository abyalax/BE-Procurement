services:
  postgres:
    image: postgres:16
    container_name: procurement-postgres
    restart: no
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - procurement_postgres_data:/var/lib/postgresql/data
    networks:
      - procurement-network

  redis:
    image: redis:7-alpine
    container_name: procurement-redis
    restart: no
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - procurement_redis_data:/data
    networks:
      - procurement-network

volumes:
  procurement_postgres_data:
  procurement_redis_data:

networks:
  procurement-network:
    driver: bridge