info:
  name: Get current authenticated user
  type: http
  seq: 4
  tags:
    - user-controller

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users/me"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/users/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "success": false,
            "message": "",
            "data": {
              "id": 0,
              "name": "",
              "email": "",
              "status": "ACTIVE",
              "roles": [],
              "permissions": [],
              "createdAt": "",
              "updatedAt": ""
            },
            "timestamp": ""
          }
