info:
  name: Update user. Admin only.
  type: http
  seq: 2
  tags:
    - user-controller

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/users/:id"
  params:
    - name: id
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "name": "",
        "email": "",
        "status": "ACTIVE",
        "roles": []
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/users/:id"
      method: PUT
      params:
        - name: id
          value: ""
          type: path
      body:
        type: json
        data: |-
          {
            "name": "",
            "email": "",
            "status": "ACTIVE",
            "roles": []
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "success": false,
            "message": "",
            "data": {
              "id": 0,
              "name": "",
              "email": "",
              "status": "ACTIVE",
              "roles": [],
              "permissions": [],
              "createdAt": "",
              "updatedAt": ""
            },
            "timestamp": ""
          }
