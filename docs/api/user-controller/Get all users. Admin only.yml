info:
  name: Get all users. Admin only.
  type: http
  seq: 3
  tags:
    - user-controller

http:
  method: GET
  url: "{{baseUrl}}/api/v1/users"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "20"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/users"
      method: GET
      params:
        - name: page
          value: "0"
          type: query
        - name: size
          value: "20"
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "success": false,
            "message": "",
            "data": {
              "items": [
                {
                  "id": 0,
                  "name": "",
                  "email": "",
                  "status": "ACTIVE",
                  "roles": [],
                  "permissions": [],
                  "createdAt": "",
                  "updatedAt": ""
                }
              ],
              "page": 0,
              "size": 0,
              "totalItems": 0,
              "totalPages": 0,
              "hasNext": false,
              "hasPrevious": false
            },
            "timestamp": ""
          }
