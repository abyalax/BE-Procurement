info:
  name: Login user
  type: http
  seq: 2
  tags:
    - auth-controller

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "admin@procurement.local",
        "password": "password"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 Response
    description: OK
    request:
      url: "{{baseUrl}}/api/v1/auth/login"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "",
            "password": ""
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: "*/*"
      body:
        type: text
        data: |-
          {
            "success": false,
            "message": "",
            "data": {
              "accessToken": "",
              "tokenType": "",
              "expiresInMs": 0,
              "user": {
                "id": 0,
                "name": "",
                "email": "",
                "status": "ACTIVE",
                "roles": [],
                "permissions": [],
                "createdAt": "",
                "updatedAt": ""
              }
            },
            "timestamp": ""
          }
