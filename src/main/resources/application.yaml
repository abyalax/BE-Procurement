spring:
  application:
    name: procurement

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:db_procurement}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  cache:
    type: redis

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${APP_PORT:8080}
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  seed:
    admin-email: ${DEFAULT_ADMIN_EMAIL:admin@procurement.local}
    admin-password: ${DEFAULT_ADMIN_PASSWORD:Admin12345!}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.procurement: INFO
    org.springframework.security: INFO
