spring:
  application:
    name: procurement

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:db_procurement}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:false}
    change-log: classpath:db/changelog/db.changelog-master.yml

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  cache:
    type: redis

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${APP_PORT:8080}
  shutdown: graceful

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001
      - http://127.0.0.1:3000
      - http://127.0.0.1:3001
  jobs:
    rfq-expiry:
      enabled: ${RFQ_EXPIRY_JOB_ENABLED:true}
      fixed-delay-ms: ${RFQ_EXPIRY_JOB_FIXED_DELAY_MS:60000}
      initial-delay-ms: ${RFQ_EXPIRY_JOB_INITIAL_DELAY_MS:10000}
      batch-size: ${RFQ_EXPIRY_JOB_BATCH_SIZE:100}
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.procurement: INFO
    org.springframework.security: INFO
